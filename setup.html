<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>系统初始化 - 管理部门打分系统</title>
  <link rel="stylesheet" href="assets/style.css" />
  <script src="assets/firebase-config.js"></script>
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
    }
  }
  </script>
</head>
<body>
  <div class="centered">
    <div class="auth-card">
      <div class="logo">系统初始化</div>
      <div class="sub">创建固定超级管理员账号</div>

      <div id="alertBox" class="alert" hidden></div>
      <div id="cfgBox" class="alert warn" hidden>
        尚未配置 Firebase：请先把配置填入 <b>assets/firebase-config.js</b>。
      </div>

      <div id="stepBox">
        <p class="muted">
          本页面用于在全新系统中创建唯一的超级管理员：
        </p>
        <ul class="muted">
          <li>账号（员工号）：<b>Admin</b></li>
          <li>初始密码：<b>chaojiguanliyuan</b></li>
        </ul>
        <p class="muted">
          初始化只能执行一次。请在 Firebase 项目创建并部署安全规则后立即点击下方按钮。
        </p>
        <button id="btnInit" style="width:100%">一键初始化超级管理员</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { configured } from "./assets/firebase.js";
    import { bootstrapSuperAdmin, zhError } from "./assets/auth.js";
    import { doc, getDoc } from "firebase/firestore";
    import { db } from "./assets/firebase.js";
    import { ensureAnon } from "./assets/auth.js";

    const alertBox = document.getElementById("alertBox");
    const stepBox = document.getElementById("stepBox");
    const btn = document.getElementById("btnInit");

    if (!configured) document.getElementById("cfgBox").hidden = false;

    function show(type, msg) {
      alertBox.className = "alert " + type;
      alertBox.textContent = msg;
      alertBox.hidden = false;
    }

    (async () => {
      try {
        await ensureAnon();
        const snap = await getDoc(doc(db, "config", "bootstrap"));
        if (snap.exists()) {
          stepBox.innerHTML =
            '<div class="alert ok">系统已完成初始化，本页面不可重复使用。</div>' +
            '<p style="text-align:center;margin-top:14px"><a href="index.html">前往登录 →</a></p>';
        }
      } catch (e) {
        show("error", "连接 Firebase 失败：" + zhError(e));
      }
    })();

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      btn.textContent = "初始化中…";
      try {
        await bootstrapSuperAdmin();
        show("ok", "初始化成功！即将跳转到登录页，请使用 Admin / chaojiguanliyuan 登录。");
        setTimeout(() => (location.href = "index.html"), 1800);
      } catch (e) {
        show("error", "初始化失败：" + zhError(e));
        btn.disabled = false;
        btn.textContent = "一键初始化超级管理员";
      }
    });
  </script>
</body>
</html>
