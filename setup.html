<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>系统初始化 - 管理部门打分系统</title>
  <link rel="stylesheet" href="assets/style.css" />
  <script src="assets/lc-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4/dist/av-min.js"></script>
</head>
<body>
  <div class="centered">
    <div class="auth-card">
      <div class="logo">系统初始化</div>
      <div class="sub">创建固定超级管理员账号</div>

      <div id="alertBox" class="alert" hidden></div>
      <div id="cfgBox" class="alert warn" hidden>
        尚未配置 LeanCloud：请先把应用凭证填入 <b>assets/lc-config.js</b>。
      </div>

      <div id="stepBox">
        <p class="muted">
          本页面用于在全新系统中创建唯一的超级管理员：
        </p>
        <ul class="muted">
          <li>账号（员工号）：<b>Admin</b></li>
          <li>初始密码：<b>chaojiguanliyuan</b></li>
        </ul>
        <p class="muted">
          初始化只能执行一次。请先在 LeanCloud 控制台创建应用并配置 <b>assets/lc-config.js</b> 后点击下方按钮。
        </p>
        <button id="btnInit" style="width:100%">一键初始化超级管理员</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { configured } from "./assets/lc.js";
    import { bootstrapSuperAdmin, zhError } from "./assets/auth.js";

    const alertBox = document.getElementById("alertBox");
    const stepBox = document.getElementById("stepBox");
    const btn = document.getElementById("btnInit");

    if (!configured) document.getElementById("cfgBox").hidden = false;

    function show(type, msg) {
      alertBox.className = "alert " + type;
      alertBox.textContent = msg;
      alertBox.hidden = false;
    }

    (async () => {
      if (!configured) return;
      try {
        const q = new AV.Query("config");
        q.equalTo("name", "bootstrap");
        const boot = await q.first();
        if (boot) {
          stepBox.innerHTML =
            '<div class="alert ok">系统已完成初始化，本页面不可重复使用。</div>' +
            '<p style="text-align:center;margin-top:14px"><a href="index.html">前往登录 →</a></p>';
        }
      } catch (e) {
        show("error", "连接 LeanCloud 失败：" + zhError(e));
      }
    })();

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      btn.textContent = "初始化中…";
      try {
        await bootstrapSuperAdmin();
        show("ok", "初始化成功！即将跳转到登录页，请使用 Admin / chaojiguanliyuan 登录。");
        setTimeout(() => (location.href = "index.html"), 1800);
      } catch (e) {
        show("error", "初始化失败：" + zhError(e));
        btn.disabled = false;
        btn.textContent = "一键初始化超级管理员";
      }
    });
  </script>
</body>
</html>
