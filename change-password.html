<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>修改密码 - 中后台评价系统</title>
  <link rel="stylesheet" href="assets/style.css" />
  <script src="assets/lc-config.js"></script>
</head>
<body>
  <div class="centered">
    <form class="auth-card" id="pwdForm">
      <div class="logo">修改密码</div>
      <div class="sub" id="subTitle">设置您的新密码</div>

      <div id="forcedTip" class="alert warn">
        首次登录请先修改初始密码 <b>000000</b>，修改前无法使用系统。
      </div>
      <div id="alertBox" class="alert error" hidden></div>

      <label class="field" id="oldWrap" hidden>
        <span>原密码</span>
        <input type="password" id="oldPassword" autocomplete="current-password" />
      </label>
      <label class="field">
        <span>新密码（至少 6 位，不能为 000000）</span>
        <input type="password" id="newPassword" autocomplete="new-password" minlength="6" required />
      </label>
      <label class="field">
        <span>确认新密码</span>
        <input type="password" id="confirmPassword" autocomplete="new-password" minlength="6" required />
      </label>
      <button type="submit" id="btnSave">确认修改</button>
      <p id="backLink" style="text-align:center;margin-top:14px" hidden>
        <a href="#" id="backHref">返回</a>
      </p>
    </form>
  </div>

  <script type="module">
    import {
      getCurrentProfile,
      changeMyPassword,
      homePath,
      zhError,
    } from "./assets/auth.js";

    const profile = await getCurrentProfile();
    if (!profile) {
      location.replace("index.html");
      throw new Error("redirect");
    }

    const forced = profile.mustChangePassword === true;
    const oldWrap = document.getElementById("oldWrap");
    const oldInput = document.getElementById("oldPassword");
    const forcedTip = document.getElementById("forcedTip");
    const subTitle = document.getElementById("subTitle");
    const alertBox = document.getElementById("alertBox");
    const btn = document.getElementById("btnSave");
    const backLink = document.getElementById("backLink");

    if (forced) {
      subTitle.textContent = "首次登录，请修改初始密码";
      oldWrap.hidden = true;
      forcedTip.hidden = false;
      backLink.hidden = true;
    } else {
      subTitle.textContent = "修改登录密码";
      oldWrap.hidden = false;
      oldInput.required = true;
      forcedTip.hidden = true;
      backLink.hidden = false;
      document.getElementById("backHref").href = homePath(profile.role);
    }

    function showError(msg) {
      alertBox.textContent = msg;
      alertBox.hidden = false;
    }

    document.getElementById("pwdForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.hidden = true;
      const np = document.getElementById("newPassword").value;
      const cp = document.getElementById("confirmPassword").value;
      if (np !== cp) return showError("两次输入的新密码不一致");
      btn.disabled = true;
      btn.textContent = "提交中…";
      try {
        await changeMyPassword(profile, { oldPassword: oldInput.value, newPassword: np });
        btn.textContent = "修改成功，跳转中…";
        setTimeout(() => location.replace(homePath(profile.role)), 800);
      } catch (err) {
        showError(zhError(err));
        btn.disabled = false;
        btn.textContent = "确认修改";
      }
    });
  </script>
</body>
</html>
